<div class="modal-overlay">
  <div class="modal-box">
    <button class="close-btn">&times;</button>
    <div class="modal-layout">
      <!-- LADO IZQUIERDO -->
      <div class="modal-left">
        <span class="modal-greeting">BIENVENIDO DE NUEVO</span>
        <h2 class="modal-title">Inicia sesión en CliniQ</h2>
        <form class="auth-form">
          <label>Dirección de correo electrónico</label>
          <input type="email" placeholder="tucorreo@email.com" required />
          <label>Contraseña</label>
          <input type="password" placeholder="Ingresa la contraseña" required />
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
          <button type="button" class="btn-submit">INICIAR SESIÓN</button>
        </form>
        <div class="auth-prompt">
          ¿Aún no tienes una cuenta? <span class="switch-link">Regístrate GRATIS</span>
        </div>
      </div>

      <!-- LADO DERECHO -->
      <div class="modal-right">
        <div class="info-bubble">
          <p>
            <em>Protegemos tus datos clínicos. Todo registro está respaldado por nuestra arquitectura Blockchain y triaje por IA.</em>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
